[project]
name = "wg4-knowledge-demo"
version = "0.1.0"
description = "WG4講演用：現場知識をつなぐミニエージェント"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=23.1.0",
    "graphviz>=0.20.3",
    "networkx>=3.4.0",
    "openai>=2.0.0",
    "openai-agents>=0.14.0",
    "pydantic>=2.11.0",
    "python-dotenv>=1.1.0",
    "streamlit>=1.49.0",
    "tiktoken>=0.11.0",
]

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pip-audit>=2.9.0",
    "playwright>=1.55.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.0",
    "respx>=0.22.0",
    "ruff>=0.12.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: requires explicit RUN_LIVE_TESTS=1, configured secrets, and an enabled finite usage ledger",
    "browser: requires a locally installed Playwright browser",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "E501", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S108", "S311"]
"scripts/create_password_hash.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["tests/browser/"]

[[tool.mypy.overrides]]
module = ["streamlit.*", "networkx.*", "graphviz.*", "tiktoken.*"]
ignore_missing_imports = true
